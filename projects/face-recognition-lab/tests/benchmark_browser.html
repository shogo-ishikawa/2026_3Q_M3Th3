<!doctype html><html lang="ja"><meta charset="utf-8"><title>FACEGATE 比較計測</title>
<body><h1>同じ画像での比較計測</h1><p>v1.0.0の表情あり処理と、v1.1.0の高速照合を比較します。最初の1回を除き3回の中央値を表示します。機種ごとの目安です。</p><input id="image" type="file" accept="image/*" aria-label="比較する画像"><pre id="result" role="status">画像を選んでください</pre>
<script type="module">
import {FaceEngine as Baseline} from './baseline-engine.js';
import {FaceInferenceClient} from '../inference-client.js';
const result=document.querySelector('#result');
const median=values=>[...values].sort((a,b)=>a-b)[Math.floor(values.length/2)];
document.querySelector('#image').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;let image,baseline,current;
 try{
  image=await createImageBitmap(file);baseline=new Baseline();
  result.textContent='旧版のモデルを準備しています';await baseline.load(p=>result.textContent='旧版: '+p.message);
  await baseline.analyze(image,{maxFaces:3,expressions:true});
  const oldRuns=[];
  for(let i=0;i<3;i++){result.textContent=`旧版 ${i+1}/3`;oldRuns.push(await baseline.analyze(image,{maxFaces:3,expressions:true}));}
  await baseline.dispose();baseline=null;
  current=new FaceInferenceClient();result.textContent='新版のモデルを準備しています';await current.load(p=>result.textContent='新版: '+p.message);
  await current.analyze(image,{maxFaces:6,expressions:false,profile:'fast'});
  const newRuns=[];
  for(let i=0;i<3;i++){result.textContent=`新版 ${i+1}/3`;newRuns.push(await current.analyze(image,{maxFaces:6,expressions:false,profile:'fast'}));}
  result.textContent=JSON.stringify({description:'同じ画像の機能通し試験。一般的な認証精度や速度を保証する測定ではありません。',baseline:{expressions:true,runsMs:oldRuns.map(r=>r.elapsedMs),medianMs:median(oldRuns.map(r=>r.elapsedMs)),faceCounts:oldRuns.map(r=>r.faces.length)},current:{expressions:false,backend:current.backend,runsMs:newRuns.map(r=>r.elapsedMs),medianMs:median(newRuns.map(r=>r.elapsedMs)),roundTripMedianMs:median(newRuns.map(r=>r.roundTripMs)),faceCounts:newRuns.map(r=>r.faces.length)}},null,2);
 }catch(error){result.textContent='ERROR: '+error.message;}
 finally{image?.close();await baseline?.dispose();await current?.dispose();e.target.value='';}
});
</script></body></html>
