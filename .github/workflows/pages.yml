name: Publish class projects to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare password lab dependencies
        run: python -m pip install -r projects/password-lab/requirements.txt ipython
      - name: Check password lab
        working-directory: projects/password-lab
        env:
          NUMBA_NUM_THREADS: '2'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package password lab
        run: python projects/password-lab/tools/build_release.py
      - name: Check lottery JavaScript
        run: npm test --prefix projects/lottery-lab
      - name: Check lottery Python
        run: python -m unittest discover -s projects/lottery-lab/tests -p 'test_*.py'
      - name: Prepare sound lab dependencies
        run: python -m pip install -r projects/sound-analysis-lab/requirements.txt ipython
      - name: Check sound lab Python and notebook
        working-directory: projects/sound-analysis-lab
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check sound lab JavaScript
        run: npm test --prefix projects/sound-analysis-lab
      - name: Package sound lab
        run: python projects/sound-analysis-lab/tools/build_release.py
      - name: Check shared publishing
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check password JavaScript
        run: npm test --prefix projects/password-lab
      - name: Build lottery web page
        run: python projects/lottery-lab/tools/build_web.py
      - name: Assemble all published projects
        run: python tools/build_pages.py
      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy all projects together
        id: deployment
        uses: actions/deploy-pages@v5
